  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r:#B98A3C\">Get directions →<\/a>\n      <\/div>\n      <div style=\"display:flex; flex-direction:column; gap:14px\">\n        <div style=\"font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase; color:#B98A3C\">Contact<\/div>\n        <a href=\"tel:+17169516433\" style=\"font-size:16px; color:#F1EBE0\" style-hover=\"color:#B98A3C\">(716) 951-6433<\/a>\n        <a href=\"tel:+17165909129\" style=\"font-size:16px; color:#F1EBE0\" style-hover=\"color:#B98A3C\">(716) 590-9129<\/a>\n        <a href=\"mailto:mubny.events@gmail.com\" style=\"font-size:13.5px; color:rgba(241,235,224,0.65); overflow-wrap:anywhere\" style-hover=\"color:#B98A3C\">mubny.events@gmail.com<\/a>\n      <\/div>\n    <\/div>\n    <div style=\"max-width:1360px; margin:0 auto; padding:24px clamp(18px,4.5vw,40px) 40px; border-top:1px solid rgba(241,235,224,0.12); display:flex; justify-content:space-between; align-items:center; gap:24px; font-size:13px; color:rgba(241,235,224,0.42)\">\n      <span>© 2026 MUBNY Events and Banquets<\/span>\n      <button onClick=\"{{ openDash }}\" style=\"background:none; border:none; padding:0; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; color:rgba(241,235,224,0.42); cursor:pointer\" style-hover=\"color:#B98A3C\">Staff dashboard<\/button>\n    <\/div>\n  <\/footer>\n\n  <div class=\"mubny-drawer {{ dashClass }}\">\n      <div style=\"width:min(560px,100%); height:100%; background:#F7F3EC; border-left:1px solid rgba(18,38,31,0.12); display:flex; flex-direction:column; overflow-y:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:26px 32px; border-bottom:1px solid rgba(18,38,31,0.1); position:sticky; top:0; background:#F7F3EC; z-index:2\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',serif; font-size:26px; color:#12261F\">Reservations<\/div>\n            <div style=\"font-size:12.5px; color:#7A8A82; margin-top:3px\">{{ countLabel }}<\/div>\n          <\/div>\n          <button onClick=\"{{ closeDash }}\" aria-label=\"Close\" style=\"width:40px; height:40px; border-radius:100px; border:1px solid rgba(18,38,31,0.16); background:transparent; cursor:pointer; font-size:17px; color:#12261F\" style-hover=\"background:#12261F; color:#F7F3EC\">✕<\/button>\n        <\/div>\n\n        <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:56px 32px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px\">\n            <img src=\"9671e2fa-5fbc-4a66-ab1d-56563f9ff825\" alt=\"MUBNY Events and Banquets\" style=\"width:104px; height:104px\">\n            <div style=\"font-family:'Instrument Serif',serif; font-size:28px; color:#12261F; margin-top:8px\">Staff access only<\/div>\n            <div style=\"font-size:14.5px; line-height:1.6; color:#7A8A82; max-width:34ch\">Enter the venue passcode to view and edit reservations.<\/div>\n            <input type=\"password\" placeholder=\"Passcode\" value=\"{{ pinValue }}\" onChange=\"{{ setPin }}\" onKeyDown=\"{{ pinKey }}\" style=\"width:220px; margin-top:8px; padding:14px 16px; border-radius:12px; border:1px solid rgba(18,38,31,0.16); background:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:18px; letter-spacing:0.3em; text-align:center; color:#12261F\">\n            <div style=\"font-size:13px; color:#C2543F; min-height:18px\">{{ pinError }}<\/div>\n            <button onClick=\"{{ unlock }}\" style=\"padding:14px 30px; border-radius:100px; border:none; background:#14483A; color:#F7F3EC; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer\" style-hover=\"background:#0E3428\">Unlock<\/button>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:28px 32px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid rgba(18,38,31,0.1)\">\n          <div style=\"font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase; color:#B98A3C\">Add a booking<\/div>\n          <input type=\"date\" value=\"{{ formDate }}\" onChange=\"{{ setDate }}\" style=\"padding:14px 16px; border-radius:12px; border:1px solid rgba(18,38,31,0.16); background:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; color:#12261F\">\n          <input type=\"text\" placeholder=\"Event name (e.g. Khan Walima)\" value=\"{{ formTitle }}\" onChange=\"{{ setTitle }}\" style=\"padding:14px 16px; border-radius:12px; border:1px solid rgba(18,38,31,0.16); background:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; color:#12261F\">\n          <input type=\"text\" placeholder=\"Contact (name or phone)\" value=\"{{ formContact }}\" onChange=\"{{ setContact }}\" style=\"padding:14px 16px; border-radius:12px; border:1px solid rgba(18,38,31,0.16); background:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; color:#12261F\">\n          <button onClick=\"{{ addBooking }}\" style=\"padding:15px 22px; border-radius:100px; border:none; background:#14483A; color:#F7F3EC; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer\" style-hover=\"background:#0E3428\">Mark date as booked<\/button>\n        <\/div>\n\n        <div style=\"padding:24px 32px 48px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase; color:#7A8A82; margin-bottom:4px\">Upcoming<\/div>\n          <sc-for list=\"{{ bookings }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; align-items:center; gap:16px; padding:16px 18px; border-radius:14px; background:#fff; border:1px solid rgba(18,38,31,0.09)\">\n              <div style=\"display:flex; flex-direction:column; align-items:center; min-width:52px; padding:8px 0; border-radius:10px; background:rgba(20,72,58,0.07)\">\n                <span style=\"font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#7A8A82\">{{ b.mon }}<\/span>\n                <span style=\"font-family:'Instrument Serif',serif; font-size:22px; color:#14483A; line-height:1.1\">{{ b.dayNum }}<\/span>\n              <\/div>\n              <div style=\"flex:1; min-width:0\">\n                <div style=\"font-size:15px; font-weight:600; color:#12261F\">{{ b.title }}<\/div>\n                <div style=\"font-size:13px; color:#7A8A82; margin-top:2px\">{{ b.sub }}<\/div>\n              <\/div>\n              <button onClick=\"{{ b.remove }}\" aria-label=\"Remove booking\" style=\"width:32px; height:32px; border-radius:100px; border:1px solid rgba(18,38,31,0.14); background:transparent; cursor:pointer; color:#7A8A82; font-size:14px\" style-hover=\"background:#C2543F; color:#fff; border-color:#C2543F\">✕<\/button>\n            <\/div>\n          <\/sc-for>\n          <sc-if value=\"{{ noBookings }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:28px; border-radius:14px; border:1px dashed rgba(18,38,31,0.18); text-align:center; font-size:14px; color:#7A8A82\">No reservations yet. Add one above and it will show as unavailable on the site calendar.<\/div>\n          <\/sc-if>\n          <button onClick=\"{{ lockDash }}\" style=\"margin-top:14px; align-self:flex-start; background:none; border:none; padding:0; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; color:#7A8A82; cursor:pointer\" style-hover=\"color:#C2543F\">Lock dashboard<\/button>\n        <\/div>\n        <\/sc-if>\n      <\/div>\n    <\/div>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;staffPasscode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2010&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Staff dashboard&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    slide: 0,\n    monthOffset: 0,\n    selected: null,\n    dashOpen: false,\n    unlocked: false,\n    pin: \"\",\n    pinError: \"\",\n    form: { date: \"\", title: \"\", contact: \"\" },\n    bookings: [],\n  };\n\n  KEY = \"mch-reservations-v1\";\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(this.KEY);\n      if (raw) this.setState({ bookings: JSON.parse(raw) });\n      else this.setState({ bookings: [\n        { date: this.iso(new Date(Date.now() + 6 * 864e5)), title: \"Community Iftar\", contact: \"Masjid committee\" },\n        { date: this.iso(new Date(Date.now() + 13 * 864e5)), title: \"Rahman Nikah\", contact: \"(716) 555-0142\" },\n      ] });\n    } catch (e) {}\n  }\n\n  iso(d) {\n    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, \"0\")}-${String(d.getDate()).padStart(2, \"0\")}`;\n  }\n\n  save(bookings) {\n    this.setState({ bookings });\n    try { localStorage.setItem(this.KEY, JSON.stringify(bookings)); } catch (e) {}\n  }\n\n  renderVals() {\n    const MONTHS = [\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\"];\n    const SHORT = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\n    const today = new Date(); today.setHours(0,0,0,0);\n    const view = new Date(today.getFullYear(), today.getMonth() + this.state.monthOffset, 1);\n    const bookings = this.state.bookings || [];\n    const booked = {};\n    bookings.forEach(b => { booked[b.date] = b; });\n\n    const firstDay = view.getDay();\n    const daysIn = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();\n    const cells = [];\n    for (let n = 0; n < firstDay; n++) {\n      cells.push({ day: \"\", bg: \"transparent\", color: \"transparent\", border: \"transparent\", cursor: \"default\", opacity: \"1\", dot: \"transparent\", title: \"\", click: () => {} });\n    }\n    for (let d = 1; d <= daysIn; d++) {\n      const date = new Date(view.getFullYear(), view.getMonth(), d);\n      const key = this.iso(date);\n      const past = date < today;\n      const bk = booked[key];\n      const sel = this.state.selected === key;\n      cells.push({\n        day: String(d),\n        title: bk ? `Booked — ${bk.title}` : past ? \"Past date\" : \"Available\",\n        bg: sel ? \"#14483A\" : bk ? \"rgba(194,84,63,0.10)\" : \"#fff\",\n        color: sel ? \"#F7F3EC\" : bk ? \"#8E3826\" : \"#12261F\",\n        border: sel ? \"#14483A\" : bk ? \"rgba(194,84,63,0.30)\" : \"rgba(18,38,31,0.10)\",\n        cursor: past ? \"default\" : \"pointer\",\n        opacity: past ? \"0.35\" : \"1\",\n        dot: sel ? \"#B98A3C\" : bk ? \"#C2543F\" : \"#14483A\",\n        click: past ? () => {} : () => this.setState({ selected: key }),\n      });\n    }\n\n    const selKey = this.state.selected;\n    let selectedLabel = \"No date picked\", selectedNote = \"Choose a day on the calendar to see its status.\", selectedColor = \"#7A8A82\";\n    if (selKey) {\n      const [y, m, d] = selKey.split(\"-\").map(Number);\n      selectedLabel = `${MONTHS[m - 1]} ${d}, ${y}`;\n      if (booked[selKey]) { selectedNote = \"Booked — this date is unavailable.\"; selectedColor = \"#8E3826\"; }\n      else { selectedNote = \"Open — call us and we'll hold it for you.\"; selectedColor = \"#14483A\"; }\n    }\n\n    const photos = [\n      { id: \"hall-panorama\", src: \"./photos/hall-panorama.jpg\", title: \"Hall interior\", note: \"Open floor, 5,000 sq. ft.\", alt: \"Vaulted banquet hall set with round tables and gold runners\" },\n      { id: \"banquet-rounds\", src: \"./photos/banquet-rounds.jpg\", title: \"Event setup\", note: \"Banquet rounds for 300+\", alt: \"Round tables with white linens, navy chairs and crystal centerpieces\" },\n      { id: \"stage-decor\", src: \"./photos/stage-decor.jpg\", title: \"Stage decor\", note: \"Draped backdrop and staging\", alt: \"White draped stage backdrop with tufted sofa and florals\" },\n      { id: \"table-detail\", src: \"./photos/table-detail.jpg\", title: \"Table detail\", note: \"Linens, runners, centerpieces\", alt: \"Close view of a set table with gold runner and floral centerpiece\" },\n      { id: \"exterior\", src: \"./photos/exterior.jpg\", title: \"Exterior\", note: \"Clinton St frontage\", alt: \"Stone building exterior with arched window and tower\" },\n    ];\n    const maxSlide = photos.length - 1;\n    const si = Math.min(this.state.slide, maxSlide);\n    const goSlide = (n) => () => this.setState({ slide: Math.max(0, Math.min(maxSlide, n)) });\n\n    const passcode = String(this.props.staffPasscode ?? \"2010\");\n    const tryUnlock = () => {\n      if (this.state.pin === passcode) this.setState({ unlocked: true, pin: \"\", pinError: \"\" });\n      else this.setState({ pinError: \"Incorrect passcode.\" });\n    };\n\n    const sorted = bookings.slice().sort((a, b) => a.date.localeCompare(b.date));\n    const setField = (k) => (e) => this.setState({ form: Object.assign({}, this.state.form, { [k]: e.target.value }) });\n\n    return {\n      weekdays: [\"Sun\",\"Mon\",\"Tue\",\"Wed\",\"Thu\",\"Fri\",\"Sat\"],\n      cells,\n      monthLabel: `${MONTHS[view.getMonth()]} ${view.getFullYear()}`,\n      prevMonth: () => this.setState({ monthOffset: this.state.monthOffset - 1 }),\n      nextMonth: () => this.setState({ monthOffset: this.state.monthOffset + 1 }),\n      selectedLabel, selectedNote, selectedColor,\n\n      dashOpen: this.state.dashOpen,\n      dashClass: this.state.dashOpen ? \"is-open\" : \"\",\n      openDash: () => this.setState({ dashOpen: true, pin: \"\", pinError: \"\" }),\n      closeDash: () => this.setState({ dashOpen: false }),\n      locked: !this.state.unlocked,\n      unlocked: this.state.unlocked,\n      pinValue: this.state.pin,\n      pinError: this.state.pinError,\n      setPin: (e) => this.setState({ pin: e.target.value, pinError: \"\" }),\n      pinKey: (e) => { if (e.key === \"Enter\") tryUnlock(); },\n      unlock: () => tryUnlock(),\n      lockDash: () => this.setState({ unlocked: false, pin: \"\", pinError: \"\" }),\n      countLabel: `${bookings.length} date${bookings.length === 1 ? \"\" : \"s\"} marked unavailable`,\n      formDate: this.state.form.date,\n      formTitle: this.state.form.title,\n      formContact: this.state.form.contact,\n      setDate: setField(\"date\"),\n      setTitle: setField(\"title\"),\n      setContact: setField(\"contact\"),\n      addBooking: () => {\n        const f = this.state.form;\n        if (!f.date) return;\n        const next = bookings.filter(b => b.date !== f.date).concat([{ date: f.date, title: f.title || \"Reserved\", contact: f.contact || \"\" }]);\n        this.save(next);\n        this.setState({ form: { date: \"\", title: \"\", contact: \"\" } });\n      },\n      noBookings: sorted.length === 0,\n      bookings: sorted.map(b => {\n        const [y, m, d] = b.date.split(\"-\").map(Number);\n        return {\n          mon: SHORT[m - 1],\n          dayNum: String(d),\n          title: b.title,\n          sub: b.contact ? `${b.contact} · ${y}` : String(y),\n          remove: () => this.save(bookings.filter(x => x.date !== b.date)),\n        };\n      }),\n\n      photos,\n      shift: `calc(-${si} * (min(620px, 82vw) + 20px))`,\n      prev: goSlide(si - 1),\n      next: goSlide(si + 1),\n      dots: photos.map((p, n) => ({\n        go: goSlide(n),\n        width: n === si ? \"40px\" : \"16px\",\n        color: n === si ? \"#14483A\" : \"rgba(18,38,31,0.18)\",\n      })),\n      stats: [\n        { value: \"5,000\", label: \"Sq. ft. indoor space\" },\n        { value: \"300+\", label: \"Guest capacity\" },\n        { value: \"70+\", label: \"On-site parking spaces\" },\n        { value: \"5★\", label: \"Community rating\" },\n      ],\n      events: [\n        { n: \"01\", title: \"Iftar Parties\", note: \"Ramadan evenings with room for the whole jamaat.\" },\n        { n: \"02\", title: \"Nikah & Walima\", note: \"A calm, spacious setting for the celebration.\" },\n        { n: \"03\", title: \"Family Gatherings\", note: \"Birthdays, aqiqah, reunions and graduations.\" },\n        { n: \"04\", title: \"Community Dinners\", note: \"Fundraisers and organization banquets.\" },\n        { n: \"05\", title: \"Programs & Lectures\", note: \"Rows, podium and open floor for talks.\" },\n      ],\n      amenities: [\n        { title: \"Tables & chairs\", body: \"Fully furnished and ready to use on arrival.\" },\n        { title: \"300+ capacity\", body: \"Seated banquet, rows or open-floor layouts.\" },\n        { title: \"70+ parking\", body: \"On-site spaces, no street-parking scramble.\" },\n        { title: \"Open floor plan\", body: \"5,000 sq. ft. with no fixed seating.\" },\n        { title: \"Bring your caterer\", body: \"Use the vendor your family already trusts.\" },\n        { title: \"Clinton St location\", body: \"Easy access from across Buffalo.\" },\n      ],\n    };\n  }\n}\n\n<\/script>\n\n<script>\n/* Interactive backdrop — a faint field of warm dots. They bob very slowly on\n   their own, and near the cursor they swell, brighten to gold and ease away\n   from it. Self-contained: mounts its own fixed canvas behind the whole page\n   (hero included), and falls back to a still field under reduced motion. */\n(function () {\n  if (window.__mubnyDots) return;\n  window.__mubnyDots = true;\n\n  var reduce = window.matchMedia &&\n    window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  var cv = document.createElement('canvas');\n  cv.setAttribute('aria-hidden', 'true');\n  // Sits ABOVE the section backgrounds (so the dots read on the dark green\n  // bands too) but below the sticky header (z 50) and the staff drawer\n  // (z 200); pointer-events:none keeps every control clickable.\n  cv.style.cssText =\n    'position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none';\n  var ctx = cv.getContext('2d');\n\n  var DPR = Math.min(window.devicePixelRatio || 1, 2);\n  var GAP = 38, BASE_R = 1.25, BASE_A = 0.16, REACH = 165, PUSH = 26;\n  var BASE_RGB = '206,172,116';  // warm gold — legible on cream and on green\n  var DRIFT = 1.7;               // idle bob amplitude, px\n  var dots = [], W = 0, H = 0;\n  var mx = -9999, my = -9999, tx = -9999, ty = -9999;\n  var raf = 0, running = false, t0 = performance.now();\n\n  function build() {\n    W = cv.clientWidth; H = cv.clientHeight;\n    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    dots.length = 0;\n    for (var y = GAP / 2; y < H + GAP; y += GAP)\n      for (var x = GAP / 2; x < W + GAP; x += GAP)\n        dots.push({ ox: x, oy: y, x: x, y: y });\n  }\n\n  function drawStill() {\n    ctx.clearRect(0, 0, W, H);\n    ctx.fillStyle = 'rgba(' + BASE_RGB + ',' + BASE_A + ')';\n    for (var i = 0; i < dots.length; i++) {\n      ctx.beginPath();\n      ctx.arc(dots[i].ox, dots[i].oy, BASE_R, 0, 6.2832);\n      ctx.fill();\n    }\n  }\n\n  function frame() {\n    mx += (tx - mx) * 0.14;\n    my += (ty - my) * 0.14;\n    var t = (performance.now() - t0) * 0.001;\n    ctx.clearRect(0, 0, W, H);\n    for (var i = 0; i < dots.length; i++) {\n      var d = dots[i];\n      // idle: a slow, tiny bob so the field feels alive before you touch it\n      var bx = d.ox + Math.sin(t * 0.5 + d.ox * 0.018 + d.oy * 0.01) * DRIFT;\n      var by = d.oy + Math.cos(t * 0.42 + d.oy * 0.02 - d.ox * 0.008) * DRIFT;\n      var dx = d.ox - mx, dy = d.oy - my;\n      var dist = Math.sqrt(dx * dx + dy * dy);\n      var gx = bx, gy = by, a = BASE_A, r = BASE_R, warm = 0;\n      if (dist < REACH) {\n        var f = 1 - dist / REACH, e = f * f, inv = dist > 0.001 ? 1 / dist : 0;\n        gx = d.ox + dx * inv * e * PUSH;\n        gy = d.oy + dy * inv * e * PUSH;\n        a = BASE_A + e * 0.42;\n        r = BASE_R + e * 1.4;\n        warm = e;\n      }\n      d.x += (gx - d.x) * 0.16;\n      d.y += (gy - d.y) * 0.16;\n      if (warm > 0) {\n        ctx.fillStyle = 'rgba(' +\n          Math.round(206 + 26 * warm) + ',' +\n          Math.round(172 + 20 * warm) + ',' +\n          Math.round(116 + 18 * warm) + ',' + a + ')';\n      } else {\n        ctx.fillStyle = 'rgba(' + BASE_RGB + ',' + a + ')';\n      }\n      ctx.beginPath();\n      ctx.arc(d.x, d.y, r, 0, 6.2832);\n      ctx.fill();\n    }\n    raf = requestAnimationFrame(frame);\n  }\n\n  function kick() {\n    if (running || reduce) return;\n    running = true;\n    raf = requestAnimationFrame(frame);\n  }\n\n  function reset() {\n    build();\n    if (reduce) { drawStill(); return; }\n    drawStill();\n    kick();\n  }\n\n  function mount() {\n    var host = document.body || document.documentElement;\n    host.appendChild(cv);\n    reset();\n    window.addEventListener('pointermove', function (ev) {\n      if (ev.pointerType === 'touch') return;\n      tx = ev.clientX; ty = ev.clientY; kick();\n    }, { passive: true });\n    window.addEventListener('pointerdown', function (ev) {\n      if (ev.pointerType === 'touch') return;\n      tx = ev.clientX; ty = ev.clientY; kick();\n    }, { passive: true });\n    document.addEventListener('mouseleave', function () {\n      tx = -9999; ty = -9999; kick();\n    });\n    var rz;\n    window.addEventListener('resize', function () {\n      clearTimeout(rz); rz = setTimeout(reset, 150);\n    });\n  }\n\n  if (document.body) mount();\n  else document.addEventListener('DOMContentLoaded', mount);\n})();\n<\/script>\n\n<\/body><\/html>"</script>
